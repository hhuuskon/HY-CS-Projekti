{% extends "wallet/base.html" %}
{% block content %}
<h2>Login</h2>
<form method="post">
  {% csrf_token %}
  Username: <input type="text" name="username"><br>
  Password: <input type="password" name="password"><br>
  <input type="submit" value="Login">
</form>
<p><a href="{% url 'wallet:register' %}">Register</a></p>
{% endblock %}
